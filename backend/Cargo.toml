[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
encoding_rs_io = "0.1.8"
quick-xml = { version = "0.42.0", features = ["serialize"] }
duckdb = "1.20000.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"] }
tower-http = { version = "0.7.1", features = ["fs"] }
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
